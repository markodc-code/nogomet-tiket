# Tri puta dnevno skine nove rezultate i kvote, izračuna model i objavi stranicu.
name: Osvježi i objavi

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"    # 07:00 po zimskom vremenu
    - cron: "0 12 * * *"   # 13:00
    - cron: "0 17 * * *"   # 18:00
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  objava:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # stari rezultati (npr. tenis unatrag 2 godine) pamte se između pokretanja
      - uses: actions/cache@v4
        with:
          path: podaci
          key: podaci-${{ github.run_id }}
          restore-keys: podaci-

      - name: Skini podatke i izračunaj model
        run: python build_data.py --force

      # Spremanje podataka u repozitorij drži automatsko osvježavanje aktivnim
      # (GitHub gasi zakazane poslove u repozitorijima bez promjena 60 dana).
      - name: Spremi data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data.json
          git diff --cached --quiet || (git commit -m "Novi podaci" && git push)

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - id: deploy
        uses: actions/deploy-pages@v4
